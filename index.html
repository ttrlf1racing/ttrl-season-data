<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TTRL Multi-Season Stats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; margin:0; padding:0; background:#050608; color:#f5f5f5; }

    header {
      background:linear-gradient(to bottom,#000000 0,#050608 70%);
      padding:16px 24px 14px;
      border-bottom:3px solid #ff0000;
    }
    .header-top {
      display:flex;
      align-items:stretch;
      justify-content:space-between;
      gap:18px;
    }
    .logo-wrap { display:flex; align-items:center; gap:14px; }
    .logo-img {
      height:60px;
      width:auto;
      display:block;
      filter:drop-shadow(0 0 8px rgba(0,0,0,0.8));
      transition:transform 0.25s ease-out;
    }
    .header-left-text h1 { margin:0; font-size:22px; }
    .header-left-text p { margin:4px 0; color:#c5c6c7; font-size:13px; }

    #fileSelect {
      padding:3px 6px;
      font-size:13px;
      border-radius:4px;
      border:1px solid #3b4252;
      background:#050608;
      color:#f5f5f5;
    }

    .header-centre {
      flex:1 1 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:6px 14px;
      border-radius:12px;
      background:#050608;
      box-shadow:0 0 18px rgba(0,0,0,0.7);
      border:2px solid rgba(107,114,128,0.7);
      min-height:70px;
    }
    .header-title-row {
      display:flex;
      gap:6px;
      align-items:baseline;
      justify-content:center;
      text-transform:uppercase;
      letter-spacing:0.16em;
      font-weight:800;
      font-size:18px;
      white-space:nowrap;
    }
    .header-title-red { color:#ff1a1a; }
    .header-title-blue { color:#1d4ed8; }
    .header-title-yellow { color:#facc15; }
    .header-subline {
      margin-top:3px;
      font-size:11px;
      letter-spacing:0.14em;
      text-transform:uppercase;
      color:#e5e7eb;
      opacity:0.9;
      text-align:center;
      white-space:nowrap;
    }

    .header-meta {
      font-size:12px;
      text-align:right;
      color:#9ca3af;
      min-width:195px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    main { padding:20px 24px 40px; max-width:1200px; margin:0 auto; }

    .cards { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:24px; }
    .card { background:#10151f; padding:12px 16px; border-radius:6px; min-width:160px; border-top:3px solid #ffcf00; }
    .card-title { font-size:13px; text-transform:uppercase; color:#c5c6c7; }
    .card-value { font-size:20px; margin-top:4px; }

    h2 { margin-top:24px; border-bottom:2px solid #007bff; padding-bottom:4px; font-size:18px; }

    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
    th, td { padding:6px 8px; text-align:left; border-bottom:1px solid #222831; }
    th { background:#11151f; position:sticky; top:0; z-index:1; }
    tr:nth-child(even) td { background:#0b0f18; }
    tr:hover td { background:#151b26; }

    #driversTable th,
    #driversTable td { font-size:12px; white-space:normal; overflow:visible; text-overflow:clip; }
    #driversTable th:nth-child(1),
    #driversTable td:nth-child(1) { width:180px; }

    .table-filter-select {
      width: 100%;
      margin-top: 4px;
      font-size: 10px;
      background: #1a1f2b;
      color: #f5f5f5;
      border: 1px solid #3b4252;
      border-radius: 3px;
      padding: 2px;
    }

    .filters { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 6px; align-items:center; }
    .filters input, .filters select, .filters button {
      padding:4px 6px;
      font-size:13px;
      border-radius:4px;
      border:1px solid #3b4252;
      background:#050608;
      color:#f5f5f5;
    }
    .filters button { cursor:pointer; background:#11151f; }
    .filters button:hover { background:#1d2535; }
    .filters label { font-size:13px; color:#c5c6c7; }

    section[data-view] { display:none; }
    section[data-view].active { display:block; }

    .scroll-body {
      max-height:520px;
      overflow-y:auto;
      display:block;
      margin-right:2px;
    }
    .scroll-body table { border-collapse:collapse; width:100%; }
    .scroll-body thead,
    .scroll-body tbody,
    .scroll-body tr {
      display:table;
      width:100%;
      table-layout:fixed;
    }

    .driver-layout { display:flex; gap:16px; margin-top:10px; }
    .driver-layout-main { flex:1 1 auto; min-width:0; }

    .driver-card {
      position:relative;
      background:radial-gradient(circle at top left,#1f2937 0,#050608 55%);
      border-radius:10px;
      padding:18px 20px 14px;
      border:1px solid #3b82f6;
      border-left:4px solid #ef4444;
      box-shadow:0 0 18px rgba(59,130,246,0.45);
      overflow:hidden;
    }
    .driver-card-header {
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:8px;
    }
    .driver-card-logo {
      width:72px;
      height:72px;
      border-radius:999px;
      object-fit:cover;
    }
    .driver-modal {
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:50;
    }
    .driver-modal.open { display:flex; }
    .driver-modal-backdrop {
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.65);
      backdrop-filter:blur(6px);
    }
    .driver-modal-card {
      position:relative;
      max-width:820px;
      width:92%;
    }
    .driver-modal-close {
      position:absolute;
      top:-10px;
      right:-10px;
      width:26px;
      height:26px;
      border-radius:999px;
      border:none;
      background:#111827;
      color:#e5e7eb;
      font-size:18px;
      cursor:pointer;
    }

    .tab-btn {
      background:#11151f;
      border:1px solid #3b4252;
      color:#f5f5f5;
      padding:6px 12px;
      border-radius:4px;
      cursor:pointer;
      font-size:13px;
    }
    .tab-btn.active { background:#007bff; border-color:#007bff; }
    .tab-btn.disabled { opacity:0.4; cursor:not-allowed; }

    .driver-row-selected td { background:#1d2935 !important; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo-wrap">
      <img src="ttrl-logo.png" alt="TTRL logo" class="logo-img">
      <div class="header-left-text">
        <h1 id="leagueTitle">TTRL Multi-Season Statistics</h1>
        <p id="raceDayLine">Choose race day to view:</p>
        <div>
          <select id="fileSelect">
            <option value="">Select race day…</option>
          </select>
        </div>
      </div>
    </div>
    <div class="header-centre">
      <div class="header-title-row">
        <span class="header-title-red">TTRL</span>
        <span class="header-title-blue">MULTI‑SEASON</span>
        <span class="header-title-yellow">INSIGHTS</span>
      </div>
      <div class="header-subline">CROSS‑ERA DRIVER & TRACK STATS</div>
    </div>
    <div class="header-meta">
      <div id="fileMeta">No file loaded yet</div>
    </div>
  </div>
</header>

<main>
  <section id="overviewSection">
    <h2>Overview</h2>
    <div class="cards" id="overviewCards"></div>
  </section>

  <section id="viewSelector">
    <div class="filters" style="margin-top:0;">
      <label style="margin-right:8px;">View:</label>
      <button class="tab-btn active" data-view="drivers">Drivers</button>
      <button class="tab-btn" data-view="tracks">Tracks</button>
    </div>
  </section>

  <section id="driversSection" data-view="drivers" class="active">
    <h2>Drivers</h2>
    <div class="filters">
      <label>Search: <input type="text" id="driverSearch" placeholder="Name..."></label>
      <label>Min seasons: <input type="number" id="minSeasons" min="1" value="1" style="width:70px;"></label>
      <label>Sort by: 
        <select id="driverSort">
          <option value="points">Total points</option>
          <option value="avgPoints">Avg pts</option>
          <option value="wins">Wins</option>
          <option value="podiums">Podiums</option>
        </select>
      </label>
    </div>

    <div class="driver-layout">
      <div class="driver-layout-main">
        <div class="scroll-body">
          <table id="driversTable">
            <thead>
              <tr>
                <th>Driver<br><select class="table-filter-select" data-col="name"><option value="">All</option></select></th>
                <th>Nat.<br><select class="table-filter-select" data-col="nationality"><option value="">All</option></select></th>
                <th>Seasons<br><select class="table-filter-select" data-col="seasons"><option value="">All</option></select></th>
                <th>Races<br><select class="table-filter-select" data-col="races"><option value="">All</option></select></th>
                <th>Total pts<br><select class="table-filter-select" data-col="totalPoints"><option value="">All</option></select></th>
                <th>Avg pts<br><select class="table-filter-select" data-col="avgPerMajor"><option value="">All</option></select></th>
                <th>Wins<br><select class="table-filter-select" data-col="wins"><option value="">All</option></select></th>
                <th>Podiums<br><select class="table-filter-select" data-col="podiums"><option value="">All</option></select></th>
                <th>Fast race laps<br><select class="table-filter-select" data-col="fastRaceLaps"><option value="">All</option></select></th>
                <th>Fast pole laps<br><select class="table-filter-select" data-col="fastPoleLaps"><option value="">All</option></select></th>
                <th>Best champ pos<br><select class="table-filter-select" data-col="bestChampPos"><option value="">All</option></select></th>
                <th>Clean %<br><select class="table-filter-select" data-col="cleanPct"><option value="">All</option></select></th>
                <th>Reliab. %<br><select class="table-filter-select" data-col="reliabPct"><option value="">All</option></select></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div id="driverPager" class="filters" style="justify-content:space-between; margin-top:6px;">
          <div><span id="driverPageInfo"></span></div>
          <div>
            <button id="driverPrevPage" class="tab-btn">&lt; Prev</button>
            <button id="driverNextPage" class="tab-btn">Next &gt;</button>
            <select id="driverPageSize">
              <option value="10">10 / page</option>
              <option value="25" selected>25 / page</option>
              <option value="50">50 / page</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="driverModal" class="driver-modal">
    <div class="driver-modal-backdrop"></div>
    <div class="driver-modal-card">
      <button id="driverModalClose" class="driver-modal-close">&times;</button>
      <div class="driver-card">
        <div class="driver-card-header">
          <img id="driverAvatar" src="" class="driver-card-logo">
          <h3 id="dcName"></h3>
        </div>
        <p id="dcMeta"></p>
        <p id="dcSummary"></p>
      </div>
    </div>
  </div>
</main>

<script>
let globalBaseData = null;
let driverRowsAll = [];
const EXPORT_FILES = [
  { value: 'export_data/sunday_races.json', label: 'Sunday races' },
  { value: 'export_data/wed_races.json',    label: 'Wednesday races' }
];

function populateFileSelect() {
  const select = document.getElementById('fileSelect');
  EXPORT_FILES.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.value;
    opt.textContent = f.label;
    select.appendChild(opt);
  });
}

/**
 * NEW: Populates filters with specialized sorting
 */
function populateTableFilters() {
    const filters = document.querySelectorAll('.table-filter-select');
    filters.forEach(select => {
        const key = select.dataset.col;
        
        // 1. Get unique values
        let uniqueValues = [...new Set(driverRowsAll.map(row => {
            const val = row[key];
            if (typeof val === 'number' && !Number.isInteger(val)) return val.toFixed(1);
            return val;
        }))].filter(v => v !== null && v !== undefined && v !== "");

        // 2. Specialized Sorting
        if (key === 'name' || key === 'nationality') {
            // Alphabetical (A to Z)
            uniqueValues.sort((a, b) => String(a).localeCompare(String(b)));
        } else {
            // Numerical / Stats (Highest to Lowest)
            uniqueValues.sort((a, b) => parseFloat(b) - parseFloat(a));
        }

        // 3. Fill the select
        select.innerHTML = '<option value="">All</option>';
        uniqueValues.forEach(val => {
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = val;
            select.appendChild(opt);
        });
    });
}

function buildPage(data) {
  const multi = data.multiSeasonStatistics || {};
  const driversSrc = multi.drivers || [];
  
  driverRowsAll = driversSrc.map(d => ({
    name: d.driverName || '',
    nationality: d.driverInfo?.nationality || '',
    seasons: d.participation?.seasonsParticipated || 0,
    races: d.participation?.totalRaces || 0,
    totalPoints: d.points?.totalPoints || 0,
    avgPerMajor: d.points?.averagePerMajorRace || 0,
    wins: d.racePositions?.wins || 0,
    podiums: d.racePositions?.podiums || 0,
    fastRaceLaps: d.racePositions?.fastestRaceLaps || 0,
    fastPoleLaps: d.qualPositions?.poles || 0,
    bestChampPos: d.standings?.bestPosition || '',
    cleanPct: d.discipline?.cleanRacePercent || 0,
    reliabPct: d.discipline?.reliabilityPercent || 0
  }));

  populateTableFilters();
  renderDrivers();
}

let driverCurrentPage = 1;
let driverPageSize = 25;

function renderDrivers() {
  const search = document.getElementById('driverSearch').value.toLowerCase();
  const minSeasons = Number(document.getElementById('minSeasons').value || 1);
  
  const colFilters = {};
  document.querySelectorAll('.table-filter-select').forEach(sel => {
      if (sel.value) colFilters[sel.dataset.col] = sel.value;
  });

  const filtered = driverRowsAll.filter(dr => {
    if (dr.seasons < minSeasons) return false;
    if (search && !dr.name.toLowerCase().includes(search)) return false;

    for (const key in colFilters) {
        let rowVal = dr[key];
        if (typeof rowVal === 'number' && !Number.isInteger(rowVal)) rowVal = rowVal.toFixed(1);
        if (String(rowVal) !== colFilters[key]) return false;
    }
    return true;
  });

  const start = (driverCurrentPage - 1) * driverPageSize;
  const pageRows = filtered.slice(start, start + driverPageSize);

  const tbody = document.querySelector('#driversTable tbody');
  tbody.innerHTML = '';
  pageRows.forEach(dr => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${dr.name}</td><td>${dr.nationality}</td><td>${dr.seasons}</td><td>${dr.races}</td><td>${dr.totalPoints}</td><td>${dr.avgPerMajor.toFixed(1)}</td><td>${dr.wins}</td><td>${dr.podiums}</td><td>${dr.fastRaceLaps}</td><td>${dr.fastPoleLaps}</td><td>${dr.bestChampPos}</td><td>${dr.cleanPct.toFixed(1)}</td><td>${dr.reliabPct.toFixed(1)}</td>`;
    tbody.appendChild(tr);
  });

  document.getElementById('driverPageInfo').textContent = `Page ${driverCurrentPage} of ${Math.ceil(filtered.length / driverPageSize)}`;
}

// Attach Listeners
document.querySelectorAll('.table-filter-select').forEach(sel => {
    sel.addEventListener('change', () => { driverCurrentPage = 1; renderDrivers(); });
});
document.getElementById('driverSearch').addEventListener('input', renderDrivers);
document.getElementById('fileSelect').onchange = (e) => {
    fetch(e.target.value).then(r => r.json()).then(buildPage);
};

populateFileSelect();
</script>
</body>
</html>
