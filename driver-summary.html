<script>
let driversSrc = [];
let driverRowsAll = [];
let currentViewMode = 'career';   // 'career' | 'season'
let currentSeasonName = null;

function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

function safeNum(v, fallback = 0) {
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
}

function deriveDriverRow(d) {
  const infoD = d.driverInfo || {};
  const points = d.points || {};
  const racePositions = d.racePositions || {};
  const discipline = d.discipline || {};
  const participation = d.participation || {};
  const standings = d.standings || {};
  return {
    source: d,
    name: d.driverName || infoD.realName || '',
    nationality: infoD.nationality || '',
    raceNumber: infoD.raceNumber || '',
    seasons: participation.seasonsParticipated || 0,
    totalPoints: safeNum(points.totalPoints),
    wins: safeNum(racePositions.wins),
    podiums: safeNum(racePositions.podiums),
    bestChampPos: standings.bestPosition || '',
    avgFinish: racePositions.averagePosition,
    cleanPct: discipline.cleanRacePercent
  };
}

function renderDriverList(filterTerm = '') {
  const list = document.getElementById('driverList');
  if (!list) return;
  list.innerHTML = '';

  const term = filterTerm.toLowerCase();
  const rows = driverRowsAll
    .slice()
    .filter(d => (d.name || '').toLowerCase().includes(term))
    .sort((a,b) => a.name.localeCompare(b.name));

  rows.forEach(row => {
    const div = document.createElement('div');
    div.className = 'driver-item';
    div.dataset.name = row.name;
    const left = document.createElement('span');
    left.textContent = row.name;
    const right = document.createElement('span');
    right.className = 'meta';
    right.textContent = '#' + (row.raceNumber || '—');
    div.appendChild(left);
    div.appendChild(right);
    list.appendChild(div);
  });
}

function fillTable(elId, rows) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = rows.map(r =>
    '<tr><td>' + r.label + '</td><td>' + (r.value ?? '') + '</td></tr>'
  ).join('');
}

function avatarFor(infoD, driverName) {
  const base = 'Drivers Avatars/';
  const raw =
    infoD.avatarFile ||
    infoD.avatar ||
    infoD.gamertag ||
    driverName ||
    '';
  if (!raw) return base + 'default.png';
  const safe = raw.replace(/[^\w.-]+/g,' ').trim().replace(/\s+/g,' ');
  return base + safe + '.gif';
}

// ---------- core render helpers ----------

function renderDriverCommonHeader(row, infoD, participation, mode, seasonName) {
  const layoutRoot = document.getElementById('layoutRoot');
  if (!layoutRoot) return;
  layoutRoot.style.display = '';

  document.getElementById('drvName').textContent = row.name || '';

  const metaParts = [];
  metaParts.push(infoD.nationality || 'Nationality unknown');
  if (infoD.raceNumber) metaParts.push('#' + infoD.raceNumber);
  if (mode === 'career' && participation.seasonsParticipated) {
    metaParts.push(participation.seasonsParticipated + ' seasons');
  }
  if (mode === 'season' && seasonName) {
    metaParts.push(seasonName);
  }
  document.getElementById('drvMeta').innerHTML =
    metaParts.map(x => '<span>' + x + '</span>').join('');

  const avatarImg = document.getElementById('drvAvatar');
  avatarImg.src = avatarFor(infoD, row.name);
  avatarImg.onerror = () => {
    if (avatarImg.src.endsWith('.gif')) {
      avatarImg.src = avatarImg.src.replace('.gif', '.png');
    } else {
      avatarImg.src = 'Drivers Avatars/default.png';
    }
  };
}

// career view
function renderDriverSummary(name) {
  const row = driverRowsAll.find(d => d.name === name);
  const layoutRoot = document.getElementById('layoutRoot');
  if (!row || !layoutRoot) {
    if (layoutRoot) layoutRoot.style.display = 'none';
    return;
  }

  currentViewMode = 'career';
  currentSeasonName = null;

  const src = row.source;
  const infoD = src.driverInfo || {};
  const participation = src.participation || {};
  const standings = src.standings || {};
  const points = src.points || {};
  const racePositions = src.racePositions || {};
  const qualPositions = src.qualPositions || {};
  const discipline = src.discipline || {};
  const seasons = standings.seasonResults || [];

  renderDriverCommonHeader(row, infoD, participation, 'career', null);

  // pill row
  document.getElementById('pillWins').textContent =
    'Wins: ' + (racePositions.wins || 0);
  document.getElementById('pillPodiums').textContent =
    'Podiums: ' + (racePositions.podiums || 0);
  document.getElementById('pillTitles').textContent =
    'Titles: ' + (standings.championshipsWon || 0);
  document.getElementById('pillAvgFinish').textContent =
    'Avg finish: ' + (racePositions.averagePosition ?? '–');
  document.getElementById('pillClean').textContent =
    'Clean %: ' + (discipline.cleanRacePercent != null ?
      discipline.cleanRacePercent : '–');

  // tables
  fillTable('tblCareer', [
    { label:'Events', value: participation.totalEvents ?? '' },
    { label:'Races', value: participation.totalRaces ?? '' },
    { label:'Seasons', value: participation.seasonsParticipated ?? '' },
    { label:'Titles', value: standings.championshipsWon ?? '' },
    { label:'Top 3', value: standings.top3Finishes ?? '' },
    { label:'Best standings', value: standings.bestPosition ?? '' },
    { label:'Avg standings', value: standings.averagePosition ?? '' },
    { label:'Event completion %', value: participation.eventCompletionRatePercent ?? '' },
    { label:'Race completion %', value: participation.raceCompletionRatePercent ?? '' }
  ]);

  fillTable('tblRaces', [
    { label:'Wins', value: racePositions.wins ?? '' },
    { label:'Podiums', value: racePositions.podiums ?? '' },
    { label:'Top 5', value: racePositions.top5 ?? '' },
    { label:'Top 10', value: racePositions.top10 ?? '' },
    { label:'Total finishes', value: racePositions.totalFinishes ?? '' },
    { label:'Best finish', value: racePositions.bestPosition != null ?
        'P' + racePositions.bestPosition : '' },
    { label:'Avg finish', value: racePositions.averagePosition ?? '' },
    { label:'Avg grid', value: racePositions.averageGridPosition ?? '' },
    { label:'Avg pos change', value: racePositions.averagePositionChange != null ?
        (racePositions.averagePositionChange > 0 ? '+' : '') +
        racePositions.averagePositionChange : '' }
  ]);

  fillTable('tblPoints', [
    { label:'Total points', value: points.totalPoints ?? '' },
    { label:'Avg per season', value: points.averagePerSeason ?? '' },
    { label:'Avg per race', value: points.averagePerMajorRace ?? '' },
    { label:'Avg per event', value: points.averagePerEvent ?? '' },
    { label:'Best season', value: points.bestSeasonPoints ?
        points.bestSeasonPoints + ' (' + (points.bestSeasonName || '') + ')' : '' },
    { label:'Scoring races', value: points.scoringRacesCount ?? '' },
    { label:'Scoring rate %', value: points.scoringRatePercent ?? '' }
  ]);

  fillTable('tblQuali', [
    { label:'Best quali', value: qualPositions.bestPosition != null ?
        'P' + qualPositions.bestPosition : '' },
    { label:'Avg quali', value: qualPositions.averagePosition ?? '' },
    { label:'Poles', value: qualPositions.poles ?? '' },
    { label:'Front rows', value: qualPositions.frontRows ?? '' },
    { label:'Top 3', value: qualPositions.top3 ?? '' },
    { label:'Top 5', value: qualPositions.top5 ?? '' },
    { label:'Top 10', value: qualPositions.top10 ?? '' },
    { label:'Qual sessions', value: qualPositions.totalQualifications ?? '' }
  ]);

  fillTable('tblDiscipline', [
    { label:'Clean races', value: discipline.cleanRacesCount ?? '' },
    { label:'Clean %', value: discipline.cleanRacePercent ?? '–' },
    { label:'Reliability %', value: discipline.reliabilityPercent ?? '' },
    { label:'DNFs', value: discipline.dnfCount ?? '' },
    { label:'DSQs', value: discipline.dsqCount ?? '' },
    { label:'Penalty seconds', value: discipline.totalPenaltySeconds ?? '' },
    { label:'Races with penalties', value: discipline.racesWithPenalties ?? '' }
  ]);

  // seasons list
  const seasonsEl = document.getElementById('listSeasons');
  seasonsEl.innerHTML = '';
  seasons.slice().sort((a,b) =>
    String(a.seasonName || '').localeCompare(String(b.seasonName || ''))
  ).forEach(s => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'season-row';

    const left = document.createElement('div');
    left.className = 'season-main';

    const title = document.createElement('div');
    title.className = 'season-name';
    title.textContent = s.seasonName || '';
    left.appendChild(title);

    const metaLine = document.createElement('div');
    metaLine.className = 'season-meta-line';

    const eventsVal = s.racesCount != null ? s.racesCount : 0;
    const lineParts = [];
    const seasonMeta = ((window.seasonMetaByName || {})[s.seasonName] || {});
    lineParts.push(eventsVal + ' events');
    lineParts.push((s.points || 0) + ' pts');
    if (seasonMeta.startDate || seasonMeta.endDate) {
      lineParts.push((seasonMeta.startDate || '?') + ' – ' + (seasonMeta.endDate || '?'));
    }
    if (seasonMeta.status) {
      lineParts.push(seasonMeta.status);
    }
    metaLine.innerHTML = lineParts.map(x => '<span>' + x + '</span>').join('');
    left.appendChild(metaLine);

    rowDiv.appendChild(left);

    const right = document.createElement('div');
    right.className = 'season-right';

    const posTag = document.createElement('div');
    posTag.className = 'tag-pill tag-pos';
    posTag.textContent = 'P' + (s.position || '–');
    right.appendChild(posTag);

    if (s.wins != null || s.podiums != null) {
      const winText = document.createElement('div');
      const parts = [];
      if (s.wins != null) parts.push(s.wins + ' wins');
      if (s.podiums != null) parts.push(s.podiums + ' podiums');
      winText.textContent = parts.join(', ');
      right.appendChild(winText);
    }

    rowDiv.appendChild(right);
    seasonsEl.appendChild(rowDiv);
  });

  // season dropdown
  setupSeasonDropdown(row.name, seasons);
}

// season-only view
function renderDriverSeasonSummary(name, seasonName) {
  const row = driverRowsAll.find(d => d.name === name);
  const layoutRoot = document.getElementById('layoutRoot');
  if (!row || !layoutRoot) return;

  currentViewMode = 'season';
  currentSeasonName = seasonName;

  const src = row.source;
  const infoD = src.driverInfo || {};
  const participation = src.participation || {};
  const standings = src.standings || {};
  const points = src.points || {};
  const discipline = src.discipline || {};
  const seasons = standings.seasonResults || [];
  const season = seasons.find(s => s.seasonName === seasonName) || {};
  const seasonMeta = (window.seasonMetaByName || {})[seasonName] || {};

  renderDriverCommonHeader(row, infoD, participation, 'season', seasonName);

  // pills – all season-based
  document.getElementById('pillWins').textContent =
    'Wins: ' + (season.wins || 0);
  document.getElementById('pillPodiums').textContent =
    'Podiums: ' + (season.podiums || 0);
  document.getElementById('pillTitles').textContent =
    'Standings: P' + (season.position || '–');
  document.getElementById('pillAvgFinish').textContent =
    'Events: ' + (season.racesCount || 0);
  document.getElementById('pillClean').textContent =
    (seasonMeta.startDate || '?') + ' – ' + (seasonMeta.endDate || '?');

  // tables – limited to what JSON exposes per season
  fillTable('tblCareer', [
    { label:'Season', value: seasonName },
    { label:'Events', value: season.racesCount ?? '' },
    { label:'Standings pos', value: season.position ?? '' },
    { label:'Season status', value: seasonMeta.status || '' }
  ]);

  fillTable('tblRaces', [
    { label:'Wins', value: season.wins ?? '' },
    { label:'Podiums', value: season.podiums ?? '' },
    { label:'Top 5', value: '' },
    { label:'Top 10', value: '' },
    { label:'Best finish', value: '' },
    { label:'Avg finish', value: '' },
    { label:'Avg grid', value: '' },
    { label:'Avg pos change', value: '' }
  ]);

  fillTable('tblPoints', [
    { label:'Season points', value: season.points ?? '' },
    { label:'Best season (career)', value: points.bestSeasonPoints ?
        points.bestSeasonPoints + ' (' + (points.bestSeasonName || '') + ')' : '' }
  ]);

  fillTable('tblQuali', [
    { label:'Best quali', value: '' },
    { label:'Avg quali', value: '' },
    { label:'Poles', value: '' },
    { label:'Front rows', value: '' },
    { label:'Top 3', value: '' },
    { label:'Top 5', value: '' },
    { label:'Top 10', value: '' },
    { label:'Qual sessions', value: '' }
  ]);

  fillTable('tblDiscipline', [
    { label:'Clean races', value: discipline.cleanRacesCount ?? '' },
    { label:'Clean % (career)', value: discipline.cleanRacePercent ?? '–' },
    { label:'Reliability %', value: discipline.reliabilityPercent ?? '' },
    { label:'DNFs', value: discipline.dnfCount ?? '' },
    { label:'DSQs', value: discipline.dsqCount ?? '' },
    { label:'Penalty seconds', value: discipline.totalPenaltySeconds ?? '' },
    { label:'Races with penalties', value: discipline.racesWithPenalties ?? '' }
  ]);

  // seasons list reuse from career
  const seasonsEl = document.getElementById('listSeasons');
  seasonsEl.innerHTML = '';
  seasons.slice().sort((a,b) =>
    String(a.seasonName || '').localeCompare(String(b.seasonName || ''))
  ).forEach(s => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'season-row';

    const left = document.createElement('div');
    left.className = 'season-main';

    const title = document.createElement('div');
    title.className = 'season-name';
    title.textContent = s.seasonName || '';
    left.appendChild(title);

    const metaLine = document.createElement('div');
    metaLine.className = 'season-meta-line';

    const eventsVal = s.racesCount != null ? s.racesCount : 0;
    const lineParts = [];
    const sm = ((window.seasonMetaByName || {})[s.seasonName] || {});
    lineParts.push(eventsVal + ' events');
    lineParts.push((s.points || 0) + ' pts');
    if (sm.startDate || sm.endDate) {
      lineParts.push((sm.startDate || '?') + ' – ' + (sm.endDate || '?'));
    }
    if (sm.status) {
      lineParts.push(sm.status);
    }
    metaLine.innerHTML = lineParts.map(x => '<span>' + x + '</span>').join('');
    left.appendChild(metaLine);

    rowDiv.appendChild(left);

    const right = document.createElement('div');
    right.className = 'season-right';

    const posTag = document.createElement('div');
    posTag.className = 'tag-pill tag-pos';
    posTag.textContent = 'P' + (s.position || '–');
    right.appendChild(posTag);

    if (s.wins != null || s.podiums != null) {
      const winText = document.createElement('div');
      const parts = [];
      if (s.wins != null) parts.push(s.wins + ' wins');
      if (s.podiums != null) parts.push(s.podiums + ' podiums');
      winText.textContent = parts.join(', ');
      right.appendChild(winText);
    }

    rowDiv.appendChild(right);
    seasonsEl.appendChild(rowDiv);
  });

  setupSeasonDropdown(row.name, seasons);
}

// build / show season dropdown (only if multiple seasons)
function setupSeasonDropdown(driverName, seasons) {
  const seasonSelect = document.getElementById('seasonSelect');
  seasonSelect.innerHTML = '';
  seasonSelect.dataset.driverName = driverName || '';

  const multiSeasons = (seasons || []).slice().sort((a,b) =>
    String(a.seasonName || '').localeCompare(String(b.seasonName || ''))
  );

  if (multiSeasons.length <= 1) {
    seasonSelect.style.display = 'none';
    document.getElementById('viewMode').value = 'career';
    return;
  }

  multiSeasons.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.seasonName;
    opt.textContent = s.seasonName;
    seasonSelect.appendChild(opt);
  });

  // default selection
  if (currentSeasonName) {
    const found = multiSeasons.find(s => s.seasonName === currentSeasonName);
    seasonSelect.value = found ? currentSeasonName : multiSeasons[0].seasonName;
  } else {
    seasonSelect.value = multiSeasons[0].seasonName;
  }

  if (currentViewMode === 'season') {
    seasonSelect.style.display = '';
  } else {
    seasonSelect.style.display = 'none';
  }
}

// ---------- load JSON ----------

function loadJsonFromStored(initialDriverName) {
  const storedJson = localStorage.getItem('ttrl_selected_json');
  if (!storedJson) return;

  fetch('export_data/' + storedJson)
    .then(r => r.json())
    .then(data => {
      const multi = data.multiSeasonStatistics || {};

      // season metadata lookup
      const seasonMetaByName = {};
      (multi.seasons || []).forEach(s => {
        seasonMetaByName[s.name] = {
          startDate: s.startDate || '',
          endDate: s.endDate || '',
          status: s.isCompleted ? 'Completed'
                 : (s.isStarted ? 'In Progress' : 'Not Started')
        };
      });
      window.seasonMetaByName = seasonMetaByName;

      driversSrc = multi.drivers || multi.driverStatistics || data.drivers || [];
      driverRowsAll = driversSrc.map(deriveDriverRow);
      renderDriverList('');
      document.getElementById('driverSearch').disabled = driverRowsAll.length === 0;

      if (initialDriverName) {
        document.getElementById('driverSearch').value = initialDriverName;
        renderDriverSummary(initialDriverName);
      }
    })
    .catch(err => alert('Failed to load JSON: ' + err.message));
}

// ---------- events ----------

// search + dropdown
document.getElementById('driverSearch').addEventListener('input', e => {
  renderDriverList(e.target.value || '');
  const panel = document.getElementById('driverList');
  if (!panel.classList.contains('open')) panel.classList.add('open');
});

document.getElementById('driverSearch').addEventListener('focus', () => {
  const panel = document.getElementById('driverList');
  if (!panel.classList.contains('open')) panel.classList.add('open');
});

document.addEventListener('click', e => {
  const dropdown = document.querySelector('.driver-list-dropdown');
  const panel = document.getElementById('driverList');
  if (!dropdown.contains(e.target)) {
    panel.classList.remove('open');
  }
});

document.getElementById('driverList').addEventListener('click', e => {
  const item = e.target.closest('.driver-item');
  if (!item) return;
  const name = item.dataset.name;
  document.getElementById('driverSearch').value = name;
  document.getElementById('driverList').classList.remove('open');

  // reset view to career when switching driver
  currentViewMode = 'career';
  currentSeasonName = null;
  document.getElementById('viewMode').value = 'career';
  document.getElementById('seasonSelect').style.display = 'none';

  renderDriverSummary(name);
});

// view mode toggle
document.getElementById('viewMode').addEventListener('change', e => {
  const mode = e.target.value;
  const seasonSelect = document.getElementById('seasonSelect');
  const drvName = seasonSelect.dataset.driverName || '';
  if (!drvName) return;

  currentViewMode = mode;

  if (mode === 'season') {
    if (seasonSelect.options.length === 0) {
      // no season view available
      e.target.value = 'career';
      return;
    }
    seasonSelect.style.display = '';
    const selectedSeason = seasonSelect.value || seasonSelect.options[0].value;
    currentSeasonName = selectedSeason;
    renderDriverSeasonSummary(drvName, selectedSeason);
  } else {
    seasonSelect.style.display = 'none';
    renderDriverSummary(drvName);
  }
});

// season change
document.getElementById('seasonSelect').addEventListener('change', e => {
  const drvName = e.target.dataset.driverName;
  if (!drvName) return;
  const seasonName = e.target.value;
  currentSeasonName = seasonName;
  renderDriverSeasonSummary(drvName, seasonName);
});

// back button
document.getElementById('backBtn').addEventListener('click', () => {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = 'index.html';
  }
});

// init
window.addEventListener('DOMContentLoaded', () => {
  const cameFromIndex = getQueryParam('from') === 'index';
  const storedDriver = localStorage.getItem('ttrl_selected_driver');

  if (cameFromIndex && storedDriver) {
    loadJsonFromStored(storedDriver);
  } else {
    loadJsonFromStored(null);
  }
});
</script>
</body>
</html>
